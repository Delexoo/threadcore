<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THREADCORE</title>
  <meta name="description" content="Download THREADCORE, a privacy-first Windows launcher for Minecraft." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --text: #f7f8fa;
      --muted: #8b93a0;
      --soft: #c2c8d2;
      --accent: #3ddc84;
      --ink: #062112;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 28px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .kicker {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 12vw, 104px);
      line-height: 0.9;
      letter-spacing: -0.045em;
    }

    .lede {
      margin: 28px 0 0;
      max-width: 34rem;
      color: var(--soft);
      font-size: 22px;
      line-height: 1.45;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 76px;
      margin-top: 40px;
      padding: 0 36px;
      border-radius: 18px;
      background: var(--accent);
      color: var(--ink);
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
    }

    .download:hover { filter: brightness(1.06); }
    .download:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    .meta {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">WINDOWS</p>
    <h1>THREADCORE</h1>
    <p class="lede">A privacy-first desktop launcher for Minecraft. Profiles stay on your PC.</p>
    <a class="download" href="https://github.com/Delexoo/threadcore/releases/download/v0.1.0/THREADCORE_0.1.0_x64-setup.exe">Download for Windows</a>
    <p class="meta">Version 0.1.0 · 64-bit installer · 3.3 MB</p>
  </main>
</body>
</html>
